spring.application.name=mes-mcp-server

server.port=8088

##### MCP server config #####
spring.ai.mcp.server.name=${spring.application.name}
spring.ai.mcp.server.version=1.0
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.type=SYNC

##### h2 config #####
spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.path=/h2-console

graphql-service-url=http://localhost:5077/graphql

spring.config.import=optional:classpath:query-defaults.yaml

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

##### OAuth PKCE Proxy Config #####
# Public base URL of this MCP server (used in metadata discovery and redirect_uri to upstream AS)
mes.oauth.issuer-uri=http://localhost:8088

# Upstream Authorization Server endpoints (Spring Authorization Server or Keycloak, etc.)
mes.oauth.upstream-authorization-uri=http://localhost:9000/oauth2/authorize
mes.oauth.upstream-token-uri=http://localhost:9000/oauth2/token

# Fixed client registered in the upstream AS for this MCP server.
# The upstream AS must allow http://localhost:8088/callback as a redirect URI for this client.
mes.oauth.upstream-client-id=demo-app
mes.oauth.upstream-client-secret=demo-app-secret